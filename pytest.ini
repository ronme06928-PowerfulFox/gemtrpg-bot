[pytest]
testpaths = tests
# Keep this file ASCII: pytest reads it with the OS locale encoding on Windows.
# Fail on deprecated SQLAlchemy APIs (e.g. Query.get) so they are replaced before upgrades.
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
markers =
    e2e: browser-driven end-to-end tests that require an app server and browser driver
