<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ジェムリアTRPG｜メインメニュー・管理画面の比較</title>
  <!--STYLE-->
</head>
<body>
  <main id="app"></main>
  <footer id="comparison-controls" aria-label="試作の切替">
    <label for="viewer">閲覧者</label>
    <select id="viewer"><option value="author">制作者</option><option value="gm">GM</option><option value="public">一般</option></select>
    <label id="admin-control"><input id="admin" type="checkbox" checked> アプリ管理者</label>
    <label for="density">文字サイズ</label>
    <select id="density"><option value="13">13px</option><option value="16">16px</option></select>
    <label for="palette">配色</label>
    <select id="palette"><option value="a" selected>宝石A · 分類別</option><option value="b">宝石B · 系統別</option></select>
  </footer>
  <dialog id="confirm" aria-labelledby="confirm-title"></dialog>
  <div id="message" role="status" class="toast" hidden></div>
  <!--SCRIPT-->
</body>
</html>
