<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジェムリアTRPGダイスボット</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon-gem.svg">
    <link rel="shortcut icon" href="/static/images/favicon-gem.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&amp;family=Zen+Antique&amp;display=swap">
    <link rel="stylesheet" href="dist/app.bundle.css?v=b47c026c4edf">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="entry-portal" data-theme="paper">
      <section class="paper-panel entry-panel">
        <div class="login-header">
            <h2>ジェムリアTRPG<br>ダイスボット</h2>
        </div>
        <div class="auth-form">
            <div class="auth-tabs">
                <button id="auth-tab-login" class="auth-tab" type="button">ログイン</button>
                <button id="auth-tab-register" class="auth-tab" type="button">新規登録</button>
                <button id="auth-tab-recover" class="auth-tab" type="button">復旧</button>
            </div>

            <!-- ログイン（主導線） -->
            <div id="auth-pane-login" class="auth-pane">
                <label for="login-name">ログインID</label>
                <input type="text" id="login-name" placeholder="ログインID" autocomplete="username">
                <label for="login-password">パスワード</label>
                <input type="password" id="login-password" placeholder="パスワード" autocomplete="current-password">
                <button id="login-btn" type="button">ログイン</button>
            </div>

            <!-- 新規登録 -->
            <div id="auth-pane-register" class="auth-pane" style="display:none;">
                <label for="register-name">ログインID</label>
                <input type="text" id="register-name" placeholder="半角英数字など" autocomplete="username">
                <label for="register-display">表示名</label>
                <input type="text" id="register-display" placeholder="ゲーム内の表示名">
                <label for="register-password">パスワード（10文字以上）</label>
                <input type="password" id="register-password" placeholder="10〜128文字" autocomplete="new-password">
                <button id="register-btn" type="button">アカウント作成</button>
            </div>

            <!-- 復旧（既存ユーザー移行/パスワード忘れ） -->
            <div id="auth-pane-recover" class="auth-pane" style="display:none;">
                <p class="auth-note">復旧コード（GEM-XXXX-XXXX）でログインし、ログインID・パスワードを設定できます。</p>
                <label for="recover-name">名前</label>
                <input type="text" id="recover-name" placeholder="登録時の名前">
                <button id="recover-code-btn" type="button">復旧コードでログイン</button>
                <p class="auth-note">管理者発行のワンタイムコードをお持ちの方：</p>
                <button id="redeem-code-btn" type="button">ワンタイムコードで再設定</button>
            </div>

            <div id="entry-message" class="auth-message"></div>
        </div>
      </section>
    </div>

    <div id="menu-portal" data-theme="paper" style="display: none;"></div>

    <div id="room-portal" data-theme="paper" style="display: none;">
    </div>

    <div id="user-management-portal" data-theme="paper" style="display: none;">
        <div class="screen-back-bar">
            <button id="back-to-menu-btn" type="button" class="screen-back" data-screen-back="menu">← メインメニュー</button>
        </div>
        <section class="paper-panel">
            <h1>ユーザー管理</h1>
            <section id="image-usage-card" class="image-usage-card" aria-labelledby="image-usage-title">
                <h2 id="image-usage-title">画像の使用量（Cloudinary）</h2>
                <div id="image-usage-status" role="status"></div>
            </section>
            <div id="user-list-container">
                <p>ユーザー情報を読み込み中...</p>
            </div>
        </section>
    </div>
    <div id="main-app-container" style="display: none;">

        <header>
            <h1>ジェムリアTRPGダイスボット</h1>

            <div class="header-room-info">
                <div id="current-room-name">ルーム名: ...</div>

                <div id="current-user-info" class="current-user-info">
                    <span id="header-username">...</span>
                    (<span id="header-attribute">...</span>)
                    <button id="user-settings-btn" class="header-icon-btn" title="設定（ユーザー設定／ルーム設定）">⚙️</button>

                    <button id="user-list-btn" class="header-icon-btn" title="ルーム参加者一覧">👤</button>
                </div>
                <button id="home-portal-btn" class="header-icon-btn" title="ルーム一覧に戻る">🏠</button>

            </div>
        </header>

        <div id="main-content">
        </div>

    </div>

    <!-- JavaScript: esbuild でバンドル済み (ソースは static/js/、ビルドは `npm run build`) -->
    <!-- app.bundle.js = クラシックスクリプト連結 / battle.bundle.js = battle/index.js のモジュールツリー -->
    <!-- ?v= はビルド時にコンテンツハッシュへ自動置換される -->
    <script defer src="dist/app.bundle.js?v=39f0db50bf3d"></script>
    <script type="module" src="dist/battle.bundle.js?v=0fa8b4efc9c7"></script>
</body>

</html>
